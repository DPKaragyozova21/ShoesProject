{% extends "base.html" %}

{% block title %}Edit Product - Admin{% endblock %}

{% block content %}
<div class="admin-form-container">
    <h2>Edit Product</h2>

    <form method="post" class="product-form">
        <div class="form-group">
            <label for="name">Product Name:</label>
            <input type="text" id="name" name="name" value="{{ product.name }}" required>
        </div>

        <div class="form-group">
            <label for="description">Description:</label>
            <textarea id="description" name="description" required>{{ product.description }}</textarea>
        </div>

        <div class="form-group">
            <label for="color">Color:</label>
            <input type="text" id="color" name="color" value="{{ product.color }}" required>
        </div>

        <div class="form-group">
            <label for="price">Price:</label>
            <input type="number" id="price" name="price" step="0.01" value="{{ product.price }}" required>
        </div>

        <div class="form-group">
            <label for="stock">Stock:</label>
            <input type="number" id="stock" name="stock" value="{{ product.stock }}" required>
        </div>

        <div class="form-group">
            <label for="image_url">Image URL:</label>
            <input type="url" id="image_url" name="image_url" value="{{ product.image_url }}" required>
        </div>

        <div class="form-group">
            <label for="sizes">Sizes (comma separated):</label>
            <input type="text" id="sizes" name="sizes" value="{{ product.sizes | join(',') }}" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Product</button>
            <a href="{{ url_for('admin_bp.admin_panel') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
